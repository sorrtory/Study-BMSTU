# https://stackoverflow.com/questions/52167869/scrape-interval-and-evaluation-interval-in-prometheus
global:
    scrape_interval: 5s

scrape_configs:
    - job_name: "loadgen"
      static_configs:
          - targets:
                - "loadgen-postgres:1111"
                - "loadgen-mongo:1111"
    - job_name: "cadvisor"
      static_configs:
          - targets: ["cadvisor:8080"]
    - job_name: "postgres"
      static_configs:
          - targets: ["postgres-exporter:9187"]
    - job_name: "mongodb"
      static_configs:
          - targets: ["mongodb-exporter:9216"]
